name: Go

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: read-all

jobs:
  build:
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x, 1.27.x]
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    env:
      CGO_ENABLED: 0
    runs-on: ${{ matrix.os }}
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: ${{ matrix.go-version }}

    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test ./...

    - name: Test No-asm
      run: go test -tags=noasm ./...

    - name: Test No-unsafe
      run: go test -tags=nounsafe ./...

    - name: Test No-unsafe, noasm
      run: go test -tags="nounsafe,noasm" ./...

    - name: Test Race 1 CPU
      env:
        CGO_ENABLED: 1
      run: go test -cpu=1 -short -race -tags=nounsafe -v ./...

    - name: Test Race 4 CPU
      env:
        CGO_ENABLED: 1
      run: go test -cpu=4 -short -race -tags=nounsafe -v ./...

  generate:
    strategy:
      matrix:
        pkg: [s2, zstd, huff0]
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: 1.27.x

    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Generate
      working-directory: ${{ matrix.pkg }}/_generate
      run: go generate -v -x

    - name: Git Status
      run: |
        git diff
        test -z "$(git status --porcelain)"

  silesia:
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: 1.27.x

    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: Cache keys
      id: keys
      run: |
        command -v zstd || sudo apt-get install -y zstd
        echo "sha256=$(sed -n 's/^zst_sha256=//p' testdata/fetch_silesia.sh)" >> "$GITHUB_OUTPUT"
        echo "zstd=$(zstd --version | sed -n 's/.* v\([0-9.]*\),.*/\1/p')" >> "$GITHUB_OUTPUT"

    - name: Cache Silesia
      uses: actions/cache@v6.1.0
      with:
        path: |
          testdata/silesia.tar
          testdata/silesia.tar.zst
        key: silesia-${{ steps.keys.outputs.sha256 }}

    - name: Cache zstd CLI encodings
      id: cli
      uses: actions/cache@v6.1.0
      with:
        path: |
          testdata/silesia.tar.19.zst
          testdata/silesia.tar.frames.zst
        key: silesia-cli-${{ steps.keys.outputs.sha256 }}-zstd${{ steps.keys.outputs.zstd }}

    - name: Fetch Silesia
      run: testdata/fetch_silesia.sh ${{ steps.cli.outputs.cache-hit != 'true' && '-cli' || '' }}

    - name: Test
      run: go test -run '^TestSilesia' -v ./zstd/ ./s2/ ./flate/

    - name: Test No-asm
      run: go test -tags=noasm -run '^TestSilesia' -v ./zstd/ ./s2/ ./flate/

  build-special:
    env:
      CGO_ENABLED: 0
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v7.0.0
      with:
        go-version: 1.27.x

    - name: Checkout code
      uses: actions/checkout@v7.0.1

    - name: fmt
      run: diff <(gofmt -d .) <(printf "")

    - name: fix
      run: diff <(go fix -diff ./...) <(printf "")

    - name: Test 386
      run: GOOS=linux GOARCH=386 go test -short ./...

    - name: Build s2c
      run: go build github.com/klauspost/compress/s2/cmd/s2c && go build github.com/klauspost/compress/s2/cmd/s2d&&./s2c -verify s2c &&./s2d s2c.s2&&rm ./s2c&&rm s2d&&rm s2c.s2

    - name: goreleaser deprecation
      run: curl -sfL https://goreleaser.com/static/run | VERSION=v2.18.2 bash -s -- check

    - name: goreleaser snapshot
      run: curl -sfL https://goreleaser.com/static/run | VERSION=v2.18.2 bash -s -- --snapshot --clean

    - name: Test S2 GOAMD64 v3
      env:
        GOAMD64: v3
      shell: bash {0}
      run: go test . -test.run=None;if [ $? -eq 0 ]; then go test ./s2/...; else true; fi

    - name: Test GOAMD64 v4
      env:
        GOAMD64: v4
      shell: bash {0}
      run: go test . -test.run=None;if [ $? -eq 0 ]; then go test ./s2/...; else true; fi

  fuzz:
    env:
      CGO_ENABLED: 0
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
        tags: [ '', 'noasm,nounsafe' ]
        # Targets that reach assembly or the unsafe loaders in internal/le.
        test: [
          flate/FuzzEncoding, flate/FuzzInflateBufio,
          huff0/FuzzCompress, huff0/FuzzDecompress1x,
          s2/FuzzDictBlocks, s2/FuzzEncodingBlocks, s2/FuzzStreamDecode, s2/FuzzDecodeBlock,
          snappy/xerial/FuzzDecode, snappy/xerial/FuzzEncode,
          zip/FuzzReader,
          zstd/FuzzDecodeAll, zstd/FuzzDecoder, zstd/FuzzEncoding,
        ]
        include:
          # Skipped unless the amd64 BMI2 asm is available.
          - { os: ubuntu-latest, tags: '', test: zstd/FuzzDecAllNoBMI2 }
          - { os: ubuntu-latest, tags: '', test: zstd/FuzzNoBMI2Dec }
          # Covers the assembly and pure Go paths in one run.
          - { os: ubuntu-latest, tags: '', test: s2/FuzzLZ4Block }
          - { os: ubuntu-24.04-arm, tags: '', test: s2/FuzzLZ4Block }
          # Pure Go: neither tags nor arch change the code under test.
          - { os: ubuntu-latest, tags: '', test: fse/FuzzCompress }
          - { os: ubuntu-latest, tags: '', test: fse/FuzzDecompress }
          - { os: ubuntu-latest, tags: '', test: lzw/FuzzAldus }
          - { os: ubuntu-latest, tags: '', test: lzw/FuzzReader }
          - { os: ubuntu-latest, tags: '', test: lzw/FuzzWriter }
          - { os: ubuntu-latest, tags: '', test: lzw/FuzzRoundtrip }
          - { os: ubuntu-latest, tags: '', test: xpress/FuzzXpressPlain }
          - { os: ubuntu-latest, tags: '', test: xpress/FuzzXpressHuffman }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: ${{ matrix.test }}/${{ matrix.tags }}
        env:
          TAGS: ${{ matrix.tags }}
          TEST: ${{ matrix.test }}
        run: go test -tags="$TAGS" -run=none -fuzz="^${TEST##*/}\$" -fuzztime=2m -test.fuzzminimizetime=100ms "./${TEST%/*}"

  # AddressSanitizer catches out-of-bounds accesses in the zstd decode assembly
  # — notably the extended (16-byte-block) memory copies in decodeSyncSimple,
  # which overrun a literal run or match by up to 15 bytes. -race and plain
  # fuzzing cannot observe such an overrun when it lands in an adjacent live
  # allocation, so asan is the only guard against a regression reintroducing the
  # 2022 crash (#644/#645, see #1168). Requires CGO + clang; run on amd64+arm64.
  fuzz-zstd-asan:
    env:
      CGO_ENABLED: 1
      CC: clang
      ASAN_OPTIONS: detect_leaks=0
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, ubuntu-24.04-arm ]
        test: [ FuzzDecodeAll, FuzzDecAllNoBMI2 ]
        exclude:
          # Skipped without BMI2.
          - { os: ubuntu-24.04-arm, test: FuzzDecAllNoBMI2 }
    steps:
      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: 1.27.x

      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: zstd/${{ matrix.test }} (asan)
        run: go test -asan -run=none -fuzz='^${{ matrix.test }}$' -fuzztime=3m -test.fuzzminimizetime=100ms ./zstd/.
